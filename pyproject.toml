[project]
name = "stock-analyst-agent"
version = "0.1.0"
description = "Personal US stock portfolio dashboard with FIFO accounting"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.40",
  "pandas>=2.2",
  "numpy>=2.0",
  "yfinance>=0.2.54",
  "plotly>=5.24",
  "groq>=0.15",
  "python-dotenv>=1.0",
  "pyxirr>=0.10",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
